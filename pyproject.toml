[project]
name = "final-year-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sugashss1", email = "sugashss1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "opencv-contrib-python>=4.10.0.84",
    "opencv-python>=5.0.0.93",
    "paddleocr[all,doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pandas>=3.0.5",
    "pylsd>=0.0.2",
    "pytesseract>=0.3.13",
    "scikit-image>=0.26.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.121",
]

[project.scripts]
final-year-project = "final_year_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
